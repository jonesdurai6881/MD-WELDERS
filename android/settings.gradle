pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'MDWelders'

include ':app'

include ':capacitor-android'
project(':capacitor-android').projectDir = new File('../frontend/node_modules/@capacitor/android/capacitor')

include ':capacitor-community-sqlite'
project(':capacitor-community-sqlite').projectDir = new File('../frontend/node_modules/@capacitor-community/sqlite/android')

include ':capacitor-app'
project(':capacitor-app').projectDir = new File('../frontend/node_modules/@capacitor/app/android')

include ':capacitor-network'
project(':capacitor-network').projectDir = new File('../frontend/node_modules/@capacitor/network/android')
